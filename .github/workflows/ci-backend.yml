name: CI Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKING_DIR: backend
  # golangci-lint must be built with a Go version >= the one targeted by go.mod (1.26).
  # v2.9.0+ is built with go1.26; pinning the minor keeps patch upgrades automatic.
  GOLANGCI_LINT_VERSION: v2.12

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Single source of truth: the Go version comes from go.mod itself.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Verify module integrity
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod verify

      - name: go.mod is tidy
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy - run 'cd backend && go mod tidy' and commit the result"
            exit 1
          fi

      - name: gofmt
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ env.WORKING_DIR }}
        run: go vet ./...

      # v9 is the first major that runs golangci-lint v2, which is the config format used
      # by backend/.golangci.yml (version: "2"). v6 pulled golangci-lint v1, which cannot
      # read that file and is built with an older Go than go.mod targets.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ env.WORKING_DIR }}

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: ${{ env.WORKING_DIR }}
        run: go mod download

      - name: Test with race detector
        working-directory: ${{ env.WORKING_DIR }}
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        working-directory: ${{ env.WORKING_DIR }}
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingest-api, analytics-api]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: pulse/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 -p 8081:8081 \
            -e APP_ENV=test -e LOG_FORMAT=text \
            pulse/${{ matrix.service }}:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 \
               || curl -fsS http://localhost:8081/healthz >/dev/null 2>&1; then
              echo "container is healthy"; docker logs smoke; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"; docker logs smoke; exit 1

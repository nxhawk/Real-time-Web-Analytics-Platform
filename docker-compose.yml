# Development stack: ClickHouse plus the two Go services.
# Kafka arrives in Level 4, the Next.js dashboard in Level 1, Prometheus/Grafana in Level 6.
#
#   make up      start everything
#   make ps      check health
#   make logs    follow logs
#
# The API containers declare no healthcheck: the distroless runtime image has no shell and no
# curl, so there is nothing to run a probe with. Readiness is checked from the host against
# /readyz (see `make health`), which is what a load balancer does in production too.

name: pulse

x-api-common: &api-common
  restart: unless-stopped
  depends_on:
    clickhouse:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  read_only: true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CLICKHOUSE_DSN: clickhouse://pulse:${CLICKHOUSE_PASSWORD:-pulse}@clickhouse:9000/analytics
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

x-build-args: &build-args
  COMMIT: ${GIT_COMMIT:-dev}
  VERSION: ${GIT_TAG:-dev}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    container_name: pulse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: pulse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulse}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP: clickhouse-client, debugging
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # native protocol: the Go driver
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./deploy/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./deploy/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  ingest-api:
    <<: *api-common
    container_name: pulse-ingest-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        <<: *build-args
        SERVICE: ingest-api
    environment:
      <<: *api-env
      HTTP_ADDR: ":8080"
    ports:
      - "${INGEST_PORT:-8080}:8080"

  analytics-api:
    <<: *api-common
    container_name: pulse-analytics-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        <<: *build-args
        SERVICE: analytics-api
    environment:
      <<: *api-env
      ANALYTICS_ADDR: ":8081"
    ports:
      - "${ANALYTICS_PORT:-8081}:8081"

volumes:
  clickhouse-data:
  clickhouse-logs:

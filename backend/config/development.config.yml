# Development configuration — loaded when APP_ENV=development (the default).
#
# This file is the source of truth for every knob. ${VAR:-fallback} takes VAR from the
# environment (or from .env) and uses the fallback when it is unset, so an unedited checkout
# starts with no .env at all. A placeholder written without a fallback is mandatory: the
# process refuses to start and names the variable. See production.config.yml.
#
# app.env must match the file name — the loader checks it.

app:
  env: "development"
  # How long in-flight requests get to finish after SIGTERM.
  shutdown_timeout: "${SHUTDOWN_TIMEOUT:-30s}"

http:
  # Listen address of the ingest API (write path).
  ingest_addr: "${HTTP_ADDR:-:8080}"
  # Listen address of the analytics API (read path).
  analytics_addr: "${ANALYTICS_ADDR:-:8081}"
  read_header_timeout: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
  read_timeout: "${HTTP_READ_TIMEOUT:-15s}"
  write_timeout: "${HTTP_WRITE_TIMEOUT:-30s}"
  idle_timeout: "${HTTP_IDLE_TIMEOUT:-60s}"
  # 1 MiB, per PLAN.md section 5.2.
  max_body_bytes: "${HTTP_MAX_BODY_BYTES:-1048576}"
  # Comma-separated. Empty means no cross-origin access; "*" allows everything.
  cors_allowed_origins: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"

log:
  level: "${LOG_LEVEL:-info}"
  # text is the readable local default; production uses json.
  format: "${LOG_FORMAT:-text}"

clickhouse:
  # Native protocol on port 9000. Never the HTTP port for inserts.
  # Inside docker compose the host is "clickhouse"; from the host machine it is "localhost".
  dsn: "${CLICKHOUSE_DSN:-clickhouse://pulse:pulse@localhost:9000/analytics}"
  max_open_conns: "${CLICKHOUSE_MAX_OPEN_CONNS:-16}"
  max_idle_conns: "${CLICKHOUSE_MAX_IDLE_CONNS:-8}"
  conn_max_lifetime: "${CLICKHOUSE_CONN_MAX_LIFETIME:-10m}"
  dial_timeout: "${CLICKHOUSE_DIAL_TIMEOUT:-5s}"
  query_timeout: "${CLICKHOUSE_QUERY_TIMEOUT:-15s}"

ingest:
  # direct = the API writes to ClickHouse itself (Levels 1-3)
  # kafka  = the API produces to Kafka and a consumer writes (Level 4+)
  sink: "${SINK:-direct}"
  # batch | single — "single" exists only to give the Level 3 benchmark a baseline.
  insert_mode: "${INSERT_MODE:-batch}"
  batch_size: "${BATCH_SIZE:-5000}"
  flush_interval_ms: "${FLUSH_INTERVAL_MS:-500}"
  # Queue between the HTTP handler and the batch writer. Must be >= batch_size.
  buffer_size: "${BUFFER_SIZE:-100000}"
  workers: "${INGEST_WORKERS:-4}"
  # Where batches land when ClickHouse cannot be reached (Level 3).
  wal_dir: "${WAL_DIR:-./data/wal}"
  # The API contract caps this at 500.
  max_events_per_request: "${MAX_EVENTS_PER_REQUEST:-500}"
  rate_limit_per_min: "${INGEST_RATE_LIMIT_PER_MIN:-1000}"
  # Query parameters stripped from page and referrer, on top of the built-in denylist
  # (token, password, email, and the other unambiguous credentials) which cannot be
  # switched off from here. Comma-separated, matched case-insensitively. Add the names
  # that are a credential in this application but ordinary data elsewhere.
  sensitive_query_params: "${SENSITIVE_QUERY_PARAMS:-}"

kafka:
  # Unused until Level 4. Setting sink=kafka with no brokers is a startup error, on purpose.
  brokers: "${KAFKA_BROKERS:-}"
  topic_raw: "${KAFKA_TOPIC_RAW:-events.raw}"
  topic_dlq: "${KAFKA_TOPIC_DLQ:-events.dlq}"
  group_id: "${KAFKA_GROUP_ID:-clickhouse-sink}"
  batch_size: "${KAFKA_CONSUMER_BATCH_SIZE:-10000}"

# Test configuration — loaded when APP_ENV=test.
#
# Used by the CI smoke test, which starts the built image with nothing but APP_ENV set, and
# by integration tests. Every value therefore has a fallback: this file must boot with an
# empty environment. The numbers are deliberately small so a test does not sit waiting for a
# 5000-row batch that will never fill.

app:
  env: "test"
  shutdown_timeout: "${SHUTDOWN_TIMEOUT:-5s}"

http:
  ingest_addr: "${HTTP_ADDR:-:8080}"
  analytics_addr: "${ANALYTICS_ADDR:-:8081}"
  read_header_timeout: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
  read_timeout: "${HTTP_READ_TIMEOUT:-15s}"
  write_timeout: "${HTTP_WRITE_TIMEOUT:-30s}"
  idle_timeout: "${HTTP_IDLE_TIMEOUT:-60s}"
  max_body_bytes: "${HTTP_MAX_BODY_BYTES:-1048576}"
  cors_allowed_origins: "${CORS_ALLOWED_ORIGINS:-*}"

log:
  level: "${LOG_LEVEL:-warn}"
  format: "${LOG_FORMAT:-text}"

clickhouse:
  dsn: "${CLICKHOUSE_DSN:-clickhouse://pulse:pulse@localhost:9000/analytics_test}"
  max_open_conns: "${CLICKHOUSE_MAX_OPEN_CONNS:-4}"
  max_idle_conns: "${CLICKHOUSE_MAX_IDLE_CONNS:-2}"
  conn_max_lifetime: "${CLICKHOUSE_CONN_MAX_LIFETIME:-1m}"
  dial_timeout: "${CLICKHOUSE_DIAL_TIMEOUT:-5s}"
  query_timeout: "${CLICKHOUSE_QUERY_TIMEOUT:-15s}"

ingest:
  sink: "${SINK:-direct}"
  insert_mode: "${INSERT_MODE:-batch}"
  batch_size: "${BATCH_SIZE:-100}"
  flush_interval_ms: "${FLUSH_INTERVAL_MS:-50}"
  buffer_size: "${BUFFER_SIZE:-1000}"
  workers: "${INGEST_WORKERS:-2}"
  wal_dir: "${WAL_DIR:-/tmp/pulse-wal}"
  max_events_per_request: "${MAX_EVENTS_PER_REQUEST:-500}"
  rate_limit_per_min: "${INGEST_RATE_LIMIT_PER_MIN:-1000000}"
  # Query parameters stripped from page and referrer, on top of the built-in denylist
  # (token, password, email, and the other unambiguous credentials) which cannot be
  # switched off from here. Comma-separated, matched case-insensitively. Add the names
  # that are a credential in this application but ordinary data elsewhere.
  sensitive_query_params: "${SENSITIVE_QUERY_PARAMS:-}"

kafka:
  brokers: "${KAFKA_BROKERS:-}"
  topic_raw: "${KAFKA_TOPIC_RAW:-events.raw}"
  topic_dlq: "${KAFKA_TOPIC_DLQ:-events.dlq}"
  group_id: "${KAFKA_GROUP_ID:-clickhouse-sink}"
  batch_size: "${KAFKA_CONSUMER_BATCH_SIZE:-1000}"
